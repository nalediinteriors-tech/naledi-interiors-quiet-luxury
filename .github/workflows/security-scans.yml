# Security scans on every push and pull request, and weekly so newly
# published library holes show up even when nobody pushes.
# Installed by the security-scans skill. Delete a job your project doesn't need.
name: security-scans

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets in the code and its history (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Scan every commit
        run: ./gitleaks git --redact --verbose .

  node-deps:
    name: JavaScript libraries with known holes (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Audit package-lock.json (high and critical fail the check)
        run: |
          if [ ! -f package-lock.json ]; then echo "No package-lock.json."; exit 0; fi
          npm audit --audit-level=high --omit=dev

  code:
    name: Risky code patterns (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.179.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan with the default rule set
        run: semgrep scan --config p/default --error --metrics off
